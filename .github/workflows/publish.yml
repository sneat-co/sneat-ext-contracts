name: Publish

# Two ways this fires:
#   1. workflow_dispatch — manual run, `dry_run` defaults TRUE. Flip it to
#      false only to force an out-of-band release; the normal path is #2.
#   2. release-on-main — automatic, triggered by CI succeeding on main.
#      Mirrors sneat-libs' release.yml shape (workflow_run on CI success ->
#      `nx release --yes`).
#
# Nx release runs in INDEPENDENT mode (nx.json) driven by version plans: only
# the projects named in consumed version plans get a new version + npm
# publish — a frozen contract with no version plan republishes never (REQ
# per-contract-independent-versioning, spec/features/ext-contracts-monorepo/
# README.md on sneat-co/sneat-libs).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run: resolve version plans and print what WOULD be released;
          publish nothing, push nothing.
        type: boolean
        required: false
        default: true
      go_module_tags:
        description: >-
          Rare catch-up escape hatch — leave empty for a normal run. JSON
          array of {"dir","version"} pairs to forward to go-module-tags
          DIRECTLY, bypassing the "does a release tag point at HEAD"
          resolution. Needed only when a family's npm release commit is no
          longer HEAD by the time you can re-dispatch (e.g. an unrelated
          fix landed on top of it in between), so the normal resolution in
          the "Resolve {dir, version} pairs" step can no longer see its
          release tag at HEAD. Ignored when dry_run is true.
        type: string
        required: false
        default: ""
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dry-run-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      released-modules: ${{ steps.go-families.outputs.json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Nx release
        run: |
          # Nx release's group hard-errors ("matches no projects") when zero
          # release-eligible projects exist — true at Phase 0 (no family
          # migrated yet). Skip gracefully rather than red-X every run.
          if ! compgen -G "libs/*/package.json" > /dev/null; then
            echo "No contract libs under libs/ yet — nothing to release."
            exit 0
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run — resolving version plans, publishing nothing."
            pnpm nx release --yes --dry-run
          else
            git config --global user.email "ci@sneat.co"
            git config --global user.name "Sneat CI"
            pnpm nx release --yes
            git push --follow-tags
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual dispatch bypasses the CI-success gate that `release-on-main`
      # relies on, so it must resolve its own Go-tag forwarding too — this
      # step is the fix for the exact gap the 2026-08-26 batch-3 manual
      # dispatch hit: nx-release-publish had already published npm and
      # pushed the release commit + npm tags, but because `release-on-main`
      # and `go-module-tags` are both gated on `github.event_name ==
      # 'workflow_run'`, no job ever forwarded {dir, version} pairs for the
      # families that also carry a Go module, and the Go tags never fired.
      # Identical resolution logic to `release-on-main`'s own step below —
      # keep both in sync if the tag pattern or manifest path ever changes.
      - name: Resolve {dir, version} pairs for families with a Go module
        id: go-families
        if: inputs.dry_run == false
        env:
          GO_MODULE_TAGS_INPUT: ${{ inputs.go_module_tags }}
        run: |
          if [[ -n "$GO_MODULE_TAGS_INPUT" ]]; then
            echo "Using explicit go_module_tags input (bypassing tag-at-HEAD resolution): $GO_MODULE_TAGS_INPUT"
            node -e "JSON.parse(process.argv[1])" "$GO_MODULE_TAGS_INPUT"
            echo "json=$GO_MODULE_TAGS_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pairs='[]'
          for gomod in */go.mod; do
            [ -e "$gomod" ] || continue
            family="$(dirname "$gomod")"
            pkg="libs/${family}/package.json"
            vfile="${family}/version.go"

            if [ -f "$pkg" ]; then
              # npm-sibling family: Go version is lockstep with npm (README
              # "Lockstep family versioning"). Only queue when npm actually
              # released this version THIS run, evidenced by its release tag
              # landing at HEAD.
              version="$(node -p "require('./${pkg}').version")"
              tag="${family}-contract-v${version}"
              if git tag --points-at HEAD | grep -qx "$tag"; then
                echo "Family '${family}' released ${version} this run (tag ${tag} @ HEAD) — queuing Go tag."
                pairs="$(echo "$pairs" | node -e "
                  const fs=require('fs');
                  const arr=JSON.parse(fs.readFileSync(0,'utf8'));
                  arr.push({dir: process.argv[1], version: process.argv[2]});
                  process.stdout.write(JSON.stringify(arr));
                " "$family" "$version")"
              fi
            elif [ -f "$vfile" ]; then
              # Go-only family (no npm sibling by design — README "Go-only
              # family versioning"): version comes from its own version.go,
              # bumped in whatever PR changes that family's contract.
              # Independent of npm/nx entirely. Queue whenever the declared
              # version has no Go tag yet, on every run (not just the run
              # that bumped it) so a tag that failed to land once still
              # catches up on the next run instead of needing a manual
              # go_module_tags rescue.
              version="$(grep -oE 'const Version = "[^"]+"' "$vfile" | sed -E 's/.*"(.*)"/\1/')"
              if [ -z "$version" ]; then
                echo "::error::${vfile} exists but no 'const Version = \"x.y.z\"' line could be parsed out of it — ${family} cannot be versioned."
                exit 1
              fi
              tag="${family}/v${version}"
              if git tag -l "$tag" | grep -qx "$tag"; then
                echo "Family '${family}' already tagged at ${version} (${tag}) — nothing to do."
              else
                echo "Family '${family}' is Go-only and untagged at ${version} — queuing Go tag."
                pairs="$(echo "$pairs" | node -e "
                  const fs=require('fs');
                  const arr=JSON.parse(fs.readFileSync(0,'utf8'));
                  arr.push({dir: process.argv[1], version: process.argv[2]});
                  process.stdout.write(JSON.stringify(arr));
                " "$family" "$version")"
              fi
            else
              # Neither an npm sibling nor a version.go: this Go module has
              # NO versioning source at all. This used to be a silent
              # ::warning:: skip — the exact defect that let competios and
              # chessraiders merge and go untagged behind a green Publish
              # run (see README "Go-only family versioning"). Fail loudly
              # instead: a merged, unversionable family must never be quiet.
              echo "::error::${gomod} has neither libs/${family}/package.json nor ${vfile} — ${family} cannot be versioned by any known mechanism. Add one before merging (see README.md 'Go-only family versioning')."
              exit 1
            fi
          done
          echo "Resolved Go-module {dir, version} pairs: $pairs"
          echo "json=$pairs" >> "$GITHUB_OUTPUT"

  release-on-main:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      released-modules: ${{ steps.go-families.outputs.json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Configure git identity for release commits
        run: |
          git config --global user.email "ci@sneat.co"
          git config --global user.name "Sneat CI"

      - name: Check for a release-eligible project
        id: has-projects
        run: |
          # Nx release's group hard-errors ("matches no projects") when zero
          # release-eligible projects exist — true at Phase 0 (no family
          # migrated yet). Skip the whole release gracefully rather than
          # red-X every CI-success-on-main until the first family lands.
          if compgen -G "libs/*/package.json" > /dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No contract libs under libs/ yet — nothing to release."
          fi

      - name: Nx release (version plans -> version -> changelog -> npm publish)
        if: steps.has-projects.outputs.any == 'true'
        run: pnpm nx release --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release commits and tags
        if: steps.has-projects.outputs.any == 'true'
        run: |
          git pull --rebase origin main
          git push --follow-tags origin main

      # A family's Go module is versioned one of two ways, resolved per
      # family below (README "Lockstep family versioning" / "Go-only family
      # versioning"; each is independent per the founder's per-contract-
      # independent-versioning ruling — an npm-sibling family's Go tag rides
      # its own npm release, a Go-only family's rides its own version.go,
      # and neither is coupled to the other or to any repo-wide cadence):
      #   - npm-sibling family: LOCKSTEP with npm. Queue only when the
      #     release step above actually cut that family's npm version THIS
      #     run — evidenced by the npm release tag
      #     ("{projectName}-v{version}", i.e. "<family>-contract-v<version>",
      #     nx.json releaseTag.pattern) landing on HEAD. This is what keeps
      #     a frozen family's Go tag from ever firing on an unrelated
      #     release.
      #   - Go-only family (no libs/<family>/package.json by design — no
      #     npm consumer exists, so manufacturing one just to source a
      #     version number would be the exact coupling the ruling rejects):
      #     version comes from that family's own <family>/version.go. Queue
      #     whenever its declared version has no Go tag yet, regardless of
      #     what changed this run, so a merge that bumps version.go always
      #     gets tagged on the very next release-on-main run and a failed
      #     tag attempt self-heals on the run after that.
      #   - Neither source present for a "<family>/go.mod" on disk: hard
      #     failure (`exit 1`), not a skip — see the inline `::error::`.
      #     This replaces the old silent `::warning::`-and-continue, which
      #     is exactly how competios and chessraiders merged and went
      #     untagged behind a green Publish run.
      - name: Resolve {dir, version} pairs for families with a Go module
        id: go-families
        run: |
          pairs='[]'
          for gomod in */go.mod; do
            [ -e "$gomod" ] || continue
            family="$(dirname "$gomod")"
            pkg="libs/${family}/package.json"
            vfile="${family}/version.go"

            if [ -f "$pkg" ]; then
              version="$(node -p "require('./${pkg}').version")"
              tag="${family}-contract-v${version}"
              if git tag --points-at HEAD | grep -qx "$tag"; then
                echo "Family '${family}' released ${version} this run (tag ${tag} @ HEAD) — queuing Go tag."
                pairs="$(echo "$pairs" | node -e "
                  const fs=require('fs');
                  const arr=JSON.parse(fs.readFileSync(0,'utf8'));
                  arr.push({dir: process.argv[1], version: process.argv[2]});
                  process.stdout.write(JSON.stringify(arr));
                " "$family" "$version")"
              fi
            elif [ -f "$vfile" ]; then
              version="$(grep -oE 'const Version = "[^"]+"' "$vfile" | sed -E 's/.*"(.*)"/\1/')"
              if [ -z "$version" ]; then
                echo "::error::${vfile} exists but no 'const Version = \"x.y.z\"' line could be parsed out of it — ${family} cannot be versioned."
                exit 1
              fi
              tag="${family}/v${version}"
              if git tag -l "$tag" | grep -qx "$tag"; then
                echo "Family '${family}' already tagged at ${version} (${tag}) — nothing to do."
              else
                echo "Family '${family}' is Go-only and untagged at ${version} — queuing Go tag."
                pairs="$(echo "$pairs" | node -e "
                  const fs=require('fs');
                  const arr=JSON.parse(fs.readFileSync(0,'utf8'));
                  arr.push({dir: process.argv[1], version: process.argv[2]});
                  process.stdout.write(JSON.stringify(arr));
                " "$family" "$version")"
              fi
            else
              echo "::error::${gomod} has neither libs/${family}/package.json nor ${vfile} — ${family} cannot be versioned by any known mechanism. Add one before merging (see README.md 'Go-only family versioning')."
              exit 1
            fi
          done
          echo "Resolved Go-module {dir, version} pairs: $pairs"
          echo "json=$pairs" >> "$GITHUB_OUTPUT"

  # Manual-dispatch counterpart to `go-module-tags` below — same reusable
  # workflow, fed by `dry-run-dispatch`'s own {dir, version} resolution
  # instead of `release-on-main`'s, since the two jobs never both run for
  # the same event (`workflow_dispatch` vs `workflow_run`).
  go-module-tags-dispatch:
    needs: dry-run-dispatch
    if: github.event_name == 'workflow_dispatch' && needs.dry-run-dispatch.outputs.released-modules != '[]' && needs.dry-run-dispatch.outputs.released-modules != ''
    permissions:
      contents: write
    uses: sneat-co/cicd/.github/workflows/go-module-tags.yml@main
    with:
      modules: ${{ needs.dry-run-dispatch.outputs.released-modules }}
    secrets: inherit

  # Armed 2026-08-26 (Phase 0 taxus seed lane): sneat-co/cicd/.github/
  # workflows/go-module-tags.yml landed on cicd main (input contract:
  # `modules` = JSON array of {"dir","version"}, optional `ref`). This job
  # fires after every release-on-main but only ever acts when
  # released-modules is non-empty — i.e. a family both released npm THIS run
  # AND has a Go module directory. Taxus itself has no Go module (confirmed:
  # no backend/, no go.mod, no .go file anywhere in sneat-co/ext-taxus's
  # history, and sneat-co/taxus — its private runtime repo — is TypeScript/
  # Angular only, no Go either), so this job stays a correct no-op for the
  # taxus release; it activates for real the first time a migrated family
  # actually ships a Go module.
  go-module-tags:
    needs: release-on-main
    if: needs.release-on-main.outputs.released-modules != '[]'
    permissions:
      contents: write
    uses: sneat-co/cicd/.github/workflows/go-module-tags.yml@main
    with:
      modules: ${{ needs.release-on-main.outputs.released-modules }}
      # ref: optional — defaults to the workflow's own `main` resolution.
    secrets: inherit
